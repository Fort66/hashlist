name: Build Linux and macOS Wheels

on: [push]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-*"
          # 🔥 ОТКЛЮЧАЕМ ИЗOЛЯЦИЮ СБOРКИ ДЛЯ PIP ВНУТРИ КОНТЕЙНЕРА:
          CIBW_ENVIRONMENT: "PIP_NO_BUILD_ISOLATION=0"
          CIBW_BEFORE_BUILD: "pip install scikit-build-core"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashlist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
