name: Build Linux and macOS Wheels

on: [push]

jobs:
  build_linux:
    name: Build wheels on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv auditwheel

      - name: Build Source and Wheel
        run: uv build

      - name: Repair Wheel to manylinux
        run: |
          # Автоматически перешиваем локальное колесо в manylinux с помощью auditwheel
          # Оно определит минимальный glibc гитхаба и сделает его переносимым
          auditwheel repair dist/*.whl --plat manylinux_2_35_x86_64 -w wheelhouse/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashlist-wheels-linux
          path: ./wheelhouse/*.whl

  build_macos:
    name: Build wheels on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build macOS wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp313-macosx_*"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hashlist-wheels-macos
          path: ./wheelhouse/*.whl
