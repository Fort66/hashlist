[project]
name = "hashlist"
version = "0.1.9"
description = "A high-performance hybrid list with O(1) hashing speed for Python."
readme = "README.md"
authors = [
    { name = "Fort66", email = "mamonov.1966@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.13.0"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.scikit-build]
# 🔥 Фикс для Windows: отключаем изоляцию сборки C++ внутри временных папок
build.verbose = true
logging.level = "INFO"

[tool.cibuildwheel.windows]
# Указываем cibuildwheel перед сборкой колеса поставить зависимости в саму систему
before-build = "pip install scikit-build-core pybind11"