[project]
name = "hashlist"
version = "0.2.0"
description = "A high-performance hybrid list with O(1) hashing speed for Python."
readme = "README.md"
authors = [
    { name = "Fort66", email = "mamonov.1966@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "cibuildwheel>=2.22.0",
]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"

[tool.cibuildwheel]
# Собираем строго под Python 3.13
build = "cp313-*"

[tool.cibuildwheel.linux]
# Указываем использовать стандартный manylinux образ
manylinux-x86_64-image = "manylinux_2_28"
before-build = "pip install scikit-build-core"

[tool.cibuildwheel.windows]
before-build = "pip install scikit-build-core"
