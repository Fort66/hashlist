[project]
name = "hashlist"
version = "0.3.0"
description = "A high-performance hybrid list with O(1) hashing speed for Python."
readme = "README.md"
authors = [
    { name = "Fort66", email = "mamonov.1966@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
# Сборщик cibuildwheel сам поставит это из безопасного кэша перед компиляцией Си-файла
requires = ["scikit-build-core>=0.10.0"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"

[tool.cibuildwheel]
# Собираем строго под Python 3.13
build = "cp313-*"
